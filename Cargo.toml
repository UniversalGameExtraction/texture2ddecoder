[package]
name = "texture2ddecoder"
version = "0.1.2"
edition = "2021"
include = [
    "src/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "COPYRIGHT"
]
authors = ["Rudolf Kolbe <rkolbe96@gmail.com>"]
description = "pure Rust no-std texture decoder"
documentation = "https://docs.rs/texture2ddecoder"
homepage = "https://crates.io/crates/texture2ddecoder"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/UniversalGameExtraction/texture2ddecoder"
categories = [
    "graphics",
    "no-std",
    "no-std::no-alloc",
    "multimedia::encoding",
    "multimedia::images"
]


[dependencies]
paste = "^1.0.12"

[features]
default = ["alloc", "astc", "atc", "bc1", "bc2", "bc3", "bc4", "bc5", "bc6", "bc7", "crunch", "etc", "pvrtc"]
alloc = []
astc = []
atc = ["bc3"]
bc1 = []
bc2 = ["bc1"]
bc3 = ["bc1"]
bc4 = ["bc3"]
bc5 = ["bc3"]
bc6 = []
bc7 = []
crunch = ["bc1", "bc3", "bc4", "bc5", "etc"]
etc = []
pvrtc = []

[dev-dependencies]
ddsfile = "^0.5.1"
image = { version = "^0.25", default-features = false, features = ["png"] }
ktx2 = "^0.4"
half = {version="2.3.1", features = []}
